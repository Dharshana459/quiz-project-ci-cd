name: MERN CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Checkout source code
      - name: Checkout Source
        uses: actions/checkout@v4

      # Login Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build Backend Image
      - name: Build Backend Image
        run: |
          docker build -t dharshanamuthukumar/quiz-project-ci-cd:backend ./backend

      # Build Frontend Image
      - name: Build Frontend Image
        run: |
          docker build -t dharshanamuthukumar/quiz-project-ci-cd:frontend ./frontend

      # Trivy Scan Backend
      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'dharshanamuthukumar/quiz-project-ci-cd:backend'
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'

      # Trivy Scan Frontend
      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'dharshanamuthukumar/quiz-project-ci-cd:frontend'
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'

      # Push Backend Image
      - name: Push Backend Image
        run: |
          docker push dharshanamuthukumar/quiz-project-ci-cd:backend

      # Push Frontend Image
      - name: Push Frontend Image
        run: |
          docker push dharshanamuthukumar/quiz-project-ci-cd:frontend
