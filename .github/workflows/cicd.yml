name: MERN CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Checkout source code
      - name: Checkout Source
        uses: actions/checkout@v4

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build Backend Docker Image
      - name: Build Backend Image
        run: |
          docker build -t dharshanamuthukumar/quiz-project-ci-cd:backend ./backend

      # Build Frontend Docker Image
      - name: Build Frontend Image
        run: |
          docker build -t dharshanamuthukumar/quiz-project-ci-cd:frontend ./frontend

      # Trivy Scan Backend
      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'dharshanamuthukumar/quiz-project-ci-cd:backend'
          format: 'table'
          exit-code: '0'
          severity: 'HIGH,CRITICAL'

      # Trivy Scan Frontend
      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'dharshanamuthukumar/quiz-project-ci-cd:frontend'
          format: 'table'
          exit-code: '0'
          severity: 'HIGH,CRITICAL'

      # Push Backend Image
      - name: Push Backend Image
        run: |
          docker push dharshanamuthukumar/quiz-project-ci-cd:backend

      # Push Frontend Image
      - name: Push Frontend Image
        run: |
          docker push dharshanamuthukumar/quiz-project-ci-cd:frontend

  deploy:
    needs: build-and-push
    runs-on: self-hosted

    steps:
      # Pull latest backend image
      - name: Pull Backend Image
        run: |
          sudo docker pull dharshanamuthukumar/quiz-project-ci-cd:backend

      # Pull latest frontend image
      - name: Pull Frontend Image
        run: |
          sudo docker pull dharshanamuthukumar/quiz-project-ci-cd:frontend

      # Stop and remove old containers
      - name: Stop Old Containers
        run: |
          sudo docker stop backend-container || true
          sudo docker rm backend-container || true

          sudo docker stop frontend-container || true
          sudo docker rm frontend-container || true

      # Run backend container
      - name: Run Backend Container
        run: |
          sudo docker run -d \
            --name backend-container \
            -p 5000:5000 \
            dharshanamuthukumar/quiz-project-ci-cd:backend

      # Run frontend container
      - name: Run Frontend Container
        run: |
          sudo docker run -d \
            --name frontend-container \
            -p 80:80 \
            dharshanamuthukumar/quiz-project-ci-cd:frontend
