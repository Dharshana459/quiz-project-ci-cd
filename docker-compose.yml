version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: quiz_db
    ports:
      - "27017:27017"
    volumes:
      - quiz_data:/data/db

  backend:
    build: ./backend
    container_name: quiz_backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/quizplatform
      - JWT_SECRET=quiz_platform_jwt_secret_2024
      - PORT=5000
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: quiz_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  quiz_data:
